<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RAG Chatbot</title>
  <link rel="stylesheet" href="/static/style.css?v=dashboard-4" />
</head>
<body>
  <header class="dashboard-header">
    <div class="brand">
      <h1>RAG Chatbot</h1>
      <p class="subtitle">Options, Futures, and Other Derivatives (8th ed.) by John C. Hull</p>
    </div>
    <nav class="nav-links" aria-label="Primary navigation">
      <button id="clear-chat" type="button">Clear chat</button>
      <a href="/dashboard">Dashboard</a>
    </nav>
  </header>

  <main id="chat" class="chat"></main>

  <div class="input-area">
    <textarea id="query" rows="1" placeholder="Ask a question…" autofocus></textarea>
    <button id="send" type="button">Send</button>
  </div>

  <script src="/static/app.js?v=dashboard-4"></script>
</body>
</html>
